<svg xmlns="http://www.w3.org/2000/svg" width="500" height="360" viewBox="0 0 500 360">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background glow -->
  <circle cx="400" cy="70" r="70" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="90" cy="280" r="55" fill="#3b82f6" opacity="0.15"/>

  <!-- glass card -->
  <rect
    x="55"
    y="35"
    width="390"
    height="290"
    rx="35"
    fill="#ffffff"
    opacity="0.92"
    filter="url(#shadow)"
  />

  <!-- floating job card -->
  <rect
    x="75"
    y="65"
    width="115"
    height="65"
    rx="15"
    fill="#ffffff"
    filter="url(#shadow)"
  />

  <circle cx="100" cy="90" r="12" fill="#3b82f6"/>
  <rect x="120" y="82" width="48" height="8" rx="4" fill="#1e293b"/>
  <rect x="120" y="98" width="35" height="6" rx="3" fill="#cbd5e1"/>

  <!-- person head -->
  <circle cx="335" cy="85" r="25" fill="#f6b77d"/>

  <!-- hair -->
  <path
    d="M310 82 C312 45 360 45 362 82 C347 70 329 69 310 82Z"
    fill="#1e293b"
  />

  <!-- body -->
  <path
    d="M300 125 C305 105 318 98 335 98 C352 98 365 105 370 125 L380 170 L290 170 Z"
    fill="#2563eb"
  />

  <!-- arms -->
  <path
    d="M305 125 L270 165"
    stroke="#f6b77d"
    stroke-width="14"
    stroke-linecap="round"
  />

  <path
    d="M365 125 L395 160"
    stroke="#f6b77d"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- laptop screen -->
  <rect
    x="145"
    y="145"
    width="210"
    height="125"
    rx="15"
    fill="#111827"
  />

  <rect
    x="157"
    y="157"
    width="186"
    height="101"
    rx="8"
    fill="url(#screen)"
  />

  <!-- code -->
  <rect x="175" y="180" width="75" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="175" y="200" width="115" height="7" rx="3" fill="#bfdbfe"/>
  <rect x="175" y="218" width="90" height="7" rx="3" fill="#ddd6fe"/>
  <rect x="175" y="236" width="125" height="7" rx="3" fill="#bfdbfe"/>

  <!-- laptop base -->
  <path
    d="M125 270 H375 L395 290 H105 Z"
    fill="#cbd5e1"
  />

  <rect x="210" y="274" width="80" height="8" rx="4" fill="#94a3b8"/>

  <!-- floating purple card -->
  <rect
    x="325"
    y="215"
    width="95"
    height="55"
    rx="14"
    fill="#ffffff"
    filter="url(#shadow)"
  />

  <circle cx="350" cy="242" r="10" fill="#8b5cf6"/>
  <rect x="367" y="235" width="35" height="7" rx="3" fill="#334155"/>
  <rect x="367" y="249" width="25" height="6" rx="3" fill="#cbd5e1"/>

  <!-- stars -->
  <path
    d="M100 180 L105 193 L118 198 L105 203 L100 216 L95 203 L82 198 L95 193 Z"
    fill="#f59e0b"
  />

  <path
    d="M410 155 L414 165 L424 169 L414 173 L410 183 L406 173 L396 169 L406 165 Z"
    fill="#60a5fa"
  />

</svg>